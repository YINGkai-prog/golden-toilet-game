<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08191d"><title>金桶公司</title><style>body{background:#08191d;color:#e4ead7;font:18px/1.7 "Microsoft JhengHei",sans-serif;min-height:95vh;margin:0;display:grid;place-items:center;text-align:center}a{color:#d7eaa3}p{color:#aabdbd}</style></head><body><main><h1>🚽 金桶公司</h1><p role="status">確認你的席位，馬上帶你進場…</p><noscript>請啟用 JavaScript 以參與活動。</noscript><a href="/play">進入遊戲</a>　<a href="/watch">觀戰席</a></main><script>
