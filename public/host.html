<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金馬桶專案｜大螢幕</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d3840'/%3E%3Cpath d='m12 24 20-11 20 11-20 12zm0 4 18 11v19L12 47zm22 11 18-11v19L34 58z' fill='%23efbe62'/%3E%3C/svg%3E">
<link rel="stylesheet" href="common.css">
<style>
body{display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:16px}
.topbar{padding:12px 26px}
.topbar .brand b{font-size:19px}
.topbar .timer{font-size:40px;min-width:150px}
.topbar .steps span{font-size:14px;padding:6px 12px}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#officeWrap{display:none;position:relative;min-height:0;border-top:3px solid #24484e}
#office{position:absolute;inset:0}
body.ov-split #officeWrap{display:block;flex:0 0 44%}
body.ov-full #officeWrap{display:block;flex:1;border-top:0}
body.ov-full #stage{display:none}
body.ov-split .qrbox canvas{width:min(30vh,300px);height:min(30vh,300px)}
body.ov-split .qrbox{padding:16px;gap:6px}
body.ov-split .qrbox .steps3{display:none}
body.ov-split .launch img.off{height:calc(56vh - 120px)}
body.ov-split .lobby,body.ov-split .org,body.ov-split .pad{padding-top:12px;padding-bottom:12px}
body.ov-split .slot{min-height:84px}
body.ov-split .tp{font-size:12px;padding:2px 6px}
body.ov-split .tp small{display:none}
body.ov-split .tgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px}
body.ov-split .bcard{min-height:0;padding:14px}body.ov-split .bcard .ic{font-size:34px}body.ov-split .bcard b{font-size:20px;margin:4px 0 0}body.ov-split .bcard p{display:none}
body.ov-split .briefs{gap:12px;margin-top:10px}
body.ov-split h1.big{font-size:30px}
body.ov-split .award{padding:6px 12px;margin:5px 0}body.ov-split .award .ic{font-size:24px}body.ov-split .award b{font-size:15px}
body.ov-split .lmid h1{font-size:clamp(24px,2.4vw,40px)}
body.ov-split .launch>div:last-child h3,body.ov-split .launch>div:last-child h3+p{display:none}

.pad{padding:22px 28px;height:100%}
h1.big{font-size:44px;line-height:1.25;letter-spacing:.02em}
/* 控制列 */
#ctl{background:#1d3840;color:#e6efe9;display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap;font-size:13px}
#ctl button{background:#2c4f57;border-color:#3c636b;color:#fff;padding:6px 11px;font-size:13px}
#ctl button:hover{background:#3a646d}
#ctl button.go{background:#c88d2e;border-color:#c88d2e;color:#1d1404;font-weight:700}
#ctl .sep{width:1px;height:24px;background:#3c636b;margin:0 4px}
#ctl select{background:#2c4f57;color:#fff;border-color:#3c636b;padding:5px 8px;font-size:13px}
#ctl .ph{display:flex;gap:3px}
#ctl .ph button{padding:5px 8px}
#ctl .ph button[aria-pressed=true]{background:#efbd5d;color:#1d1404;border-color:#efbd5d}
#ctl.min > *:not(.keep){display:none}
.drawer{position:fixed;right:0;top:0;bottom:0;width:440px;background:var(--paper);box-shadow:-10px 0 40px #0003;z-index:60;display:flex;flex-direction:column}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .body{flex:1;overflow:auto;padding:12px 18px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eef2ec;font-size:13px}
.prow .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.prow button{padding:3px 8px;font-size:12px}
/* 報到 */
.lobby{display:grid;grid-template-columns:auto 1fr;gap:34px;height:100%;padding:26px 34px}
.qrbox{background:#fff;border-radius:22px;padding:26px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.qrbox canvas{width:min(46vh,420px);height:min(46vh,420px);image-rendering:pixelated}
.qrbox .steps3{text-align:left;font-size:15px;color:#4e6962;line-height:1.9;margin-top:6px}
.qrbox .url{word-break:break-all;max-width:420px;font-size:30px;font-weight:800;color:#24484e;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.race{display:flex;flex-direction:column;min-height:0}
.podium{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px;margin:14px 0}
.slot{border-radius:16px;padding:14px 16px;background:#fff;border:2px dashed #c8d4c9;min-height:118px;display:flex;flex-direction:column;justify-content:center}
.slot .lab{font-size:13px;font-weight:700;letter-spacing:.06em}
.slot .nm{font-size:30px;font-weight:900;line-height:1.2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .ms{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot.filled{border-style:solid;animation:pop2 .5s cubic-bezier(.2,1.6,.4,1)}
.slot.boss.filled{background:linear-gradient(135deg,#fff3cf,#f2cf73);border-color:#c88d2e}
@keyframes pop2{from{transform:scale(.6);opacity:0}}
.chips-wall{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;overflow:hidden;flex:1}
.nchip{display:flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-size:16px;box-shadow:0 2px 8px #1d384014;animation:pop2 .4s ease-out}
.nchip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.nchip i{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
/* 組織圖 */
.org{display:flex;flex-direction:column;gap:14px;height:100%;padding:20px 28px}
.org .bossrow{display:flex;justify-content:center}
.ocard{background:#fff;border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);text-align:center;min-width:200px}
.ocard.boss{background:linear-gradient(135deg,#fff3cf,#f2cf73);border:2px solid #c88d2e;padding:14px 30px}
.ocard .t{font-size:13px;font-weight:700;opacity:.8}
.ocard .n{font-size:26px;font-weight:900}
.teams3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;flex:1;min-height:0}
.tcol{background:#fff;border-radius:16px;padding:14px;border-top:6px solid var(--tc);display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.tcol h3{font-size:20px;color:var(--tc)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;align-content:start;overflow:hidden}
.tp{display:flex;align-items:center;gap:7px;font-size:14px;background:#f3f6f1;border-radius:9px;padding:5px 8px;min-width:0}
.tp .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.tp b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp small{font-size:11px;color:var(--muted);white-space:nowrap}
.tp.mgr{background:#e8eff8}.tp.lead{background:#efe6f5;font-weight:700}
/* 開案 */
.briefs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px}
.bcard{padding:26px;border-radius:20px;border:3px solid var(--line);background:var(--paper);position:relative;min-height:200px;transition:.3s}
.bcard .ic{font-size:60px;line-height:1}
.bcard b{display:block;font-size:30px;margin:10px 0 2px}
.bcard .tag{color:#ad8036;font-weight:800;font-size:18px}
.bcard p{font-size:15px;color:var(--muted);margin-top:6px}
.bcard.chosen{border-color:#c88d2e;background:#fff8e6;box-shadow:0 0 0 6px #f2d38e;transform:scale(1.04)}
.bcard.dim{opacity:.3}
/* 共創／評選 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;height:100%;padding:16px 22px}
.dcol{display:flex;flex-direction:column;gap:10px;min-height:0}
.dcol .vox{flex:1;min-height:0;border:4px solid var(--tc)}
.dhead{display:flex;align-items:center;gap:12px}
.dhead b{font-size:30px;color:var(--tc)}
.dhead .cnt{margin-left:auto;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--tc)}
.dirb{background:#f1e8f6;border:1px solid #d9c3e6;color:#5d3b74;border-radius:10px;padding:6px 12px;font-size:15px}
.reqbar{align-self:center;margin-top:12px;background:#fff8e6;border:1px solid #ecd49a;border-radius:999px;padding:7px 22px;font-size:18px;color:#5b4210;white-space:nowrap;max-width:95%;overflow:hidden;text-overflow:ellipsis}
.vrow{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
.vrow .vbar{flex:1;height:22px}
/* 推廣 */
.promo{display:grid;grid-template-columns:420px 1fr;gap:20px;height:100%;padding:16px 22px 62px}
.pleft{display:flex;flex-direction:column;gap:12px;min-height:0}
.pleft .vox{flex:1;min-height:0}
.pstat{background:#fff;border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.pstat .big{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;color:#24484e}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;align-content:start;overflow:hidden}
.pcard{background:#fff;border-radius:12px;padding:8px;box-shadow:var(--shadow);position:relative}
.pcard img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;background:#eee}
.pcard .m{font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .tag{position:absolute;top:14px;right:14px;background:#297c7b;color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}
.pcard.official{outline:5px solid #c88d2e}
.pcard .votes{position:absolute;top:14px;left:14px;background:#d6453b;color:#fff;font-weight:900;font-size:18px;padding:2px 12px;border-radius:999px}
.ticker{background:#24484e;color:#fff;font-size:18px;padding:10px 0;overflow:hidden;white-space:nowrap;position:absolute;left:0;right:0;bottom:0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 40s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
/* 發表會 */
.launch{display:grid;grid-template-columns:auto 1fr 380px;gap:26px;height:100%;padding:22px 30px;background:radial-gradient(ellipse at 50% 40%,#fff8e3,#edf1eb 70%)}
.launch img.off{height:calc(100vh - 200px);max-height:760px;aspect-ratio:3/4;object-fit:cover;border-radius:16px;box-shadow:0 26px 60px #1d384044}
.lmid{display:flex;flex-direction:column;min-height:0}
.lmid .vox{flex:1;min-height:0;background:radial-gradient(ellipse at 50% 60%,#fff2c9 0%,#f3ecd6 40%,#0000 70%)}
.lmid h1{font-size:clamp(28px,3vw,50px);line-height:1.2}
.award{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;border-radius:14px;margin:8px 0;box-shadow:var(--shadow)}
.award .ic{font-size:34px}
.award b{font-size:18px}
.denied{display:grid;place-items:center;height:100%;text-align:center}
@media (max-width:1400px){#ctl .ph{display:none}.topbar .steps span{font-size:12px;padding:5px 8px}}
@media (max-height:820px){
  .tp{font-size:12px;padding:2px 6px}.tp div{line-height:1.2}
  .nchip{font-size:14px;padding:3px 10px 3px 3px}.nchip .av{width:22px;height:22px;font-size:11px}.chips-wall{gap:6px}.tp .av{width:20px;height:20px;font-size:10px}.tp small{font-size:10px}
  .tgrid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:4px}
  .org{gap:8px;padding:12px 22px}.org h1.big{font-size:28px!important}.ocard.boss{padding:8px 22px}.ocard .n{font-size:20px}
  .topbar .timer{font-size:30px}
  h1.big{font-size:34px}
  .bcard{min-height:150px;padding:18px}.bcard .ic{font-size:44px}.bcard b{font-size:24px}
  .slot{min-height:96px}.slot .nm{font-size:24px}
  .qrbox canvas{width:min(40vh,360px);height:min(40vh,360px)}
  .launch img.off{height:calc(100vh - 170px)}
}

</style>

<body class="host-page">

  <div class="steps" id="steps"></div>
  <div class="small muted" id="conncount" style="white-space:nowrap"></div>

</header>
<div id="main"><div id="stage"></div><div id="officeWrap"><div id="office"></div></div></div>
<div id="ctl" class="hidden"></div>
<script src="three.min.js"></script>
<script src="qrcode.js"></script>
<script src="shared.js"></script>
<script src="common.js"></script>
<script src="office.js"></script>
<script src="host.js"></script>
</body>
</html>
